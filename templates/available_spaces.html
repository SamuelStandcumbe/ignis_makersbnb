<!DOCTYPE html>
<html lang="en-GB">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Makers BnB</title>
        <link rel="stylesheet" href="/static/css/styles.css">
    </head>
    <body>
        <header>
            <img id="logo" src="/static/images/makers-bnb-light-mode-logo.png">
            {% include '/partials/search_bar.html' %}
            <nav>
                <a class="navigation current-page">Spaces</a>
                <a class="navigation" href="/requests">Requests</a>
                <form action="/logout" method="POST" style="display: inline; margin:0; padding: 0;">
                    <button type="submit" class="navigation">Log Out</button>
                </form>
            </nav>
        </header>
        <main>
            <h1 class="intro">Available Spaces</h1>
            <section class="spaces">
                {% for space in available_spaces %}
                    <a class="space-link" href="/make_request/{{ space.id }}">
                        <article class="space-card">
                            <h3>{{ space.space_name }}</h3>
                            <p class="space-price">£{{ space.price }} per night</p>
                            <p class="space-description">{{ space.description }}</p>
                        </article>
                    </a>
                {% endfor %}
            </section>
        </main>
    </body>
</html>
