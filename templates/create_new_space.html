<!DOCTYPE html>
<html lang="en-GB">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Makers BnB</title>
        <link rel="stylesheet" href="/static/css/styles.css">
    </head>
    <body>
        <header>
            <img id="logo" src="/static/images/makers-bnb-light-mode-logo.png" alt="MakersBnB Logo">
            {% include '/partials/search_bar.html' %}
            <nav aria-label="Main Navigation">
                <a class="navigation" href="/spaces">Spaces</a>
                <a class="navigation" href="/requests">Requests</a>
                <a class="navigation" href="/favourites">❤️</a>
                <a class="navigation current-page" href="/spaces/new" aria-current="page">Create Space</a>
                <form action="/logout" method="POST" style="display: inline; margin:0; padding: 0;">
                    <button type="submit" class="navigation">Log Out</button>
                </form>
            </nav>
        </header>
        <main>
            <h1>List a Space</h1>

            {% if errors %}
                <ul class="errors" role="alert">
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
                </ul>
            {% endif %}

            <form action="/spaces" method="POST">
                <label for="space_name">Name</label>
                <input type="text" id="space_name" name="space_name" maxlength="255" value="{{ form.get('space_name', '') }}">

                <label for="location">Location</label>
                <input type="text" id="location" name="location" maxlength="255" value="{{ form.get('location', '') }}">

                <label for="description">Description</label>
                <textarea id="description" name="description" maxlength="255">{{ form.get('description', '') }}</textarea>

                <label for="price">Price per night (£)</label>
                <input type="number" id="price" name="price" step="0.01" min="0" value="{{ form.get('price', '') }}">

                <input type="submit" value="List my space">
            </form>
        </main>
    </body>
</html>
