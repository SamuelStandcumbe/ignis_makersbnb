<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List a new space - MakersBnB</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
</head>
<body>
    <main>
        <h1>List a new space</h1>
        <form action="/spaces" method="POST">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="5" required></textarea>

            <label for="price">Price per night (£)</label>
            <input type="text" id="price" name="price" inputmode="decimal" pattern="[0-9]+(\.[0-9]{1,2})?" title="Numbers only, e.g. 85 or 85.50" required>

            <label for="available_from">Available from</label>
            <input type="date" id="available_from" name="available_from" required>

            <label for="available_to">Available to</label>
            <input type="date" id="available_to" name="available_to" required>

            <button type="submit">List my space</button>
        </form>
    </main>
</body>
</html>
