<!DOCTYPE html>
<html lang="en">
<head>
    <title>Booking requests - MakersBnB</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
</head>
<body>
    <main>
        <h1>Booking requests</h1>
        <section class="received_requests">
            <h2>Requests I've received</h2>
            {% for request in requests %}
                <article>
                    <h3>Cosy Cottage in the Cotswolds</h3>
                    <p>
                        Requested dates:
                        {{request.requested_date}}
                        <time datetime="2026-12-12">12 December 2026</time>
                        to
                        <time datetime="2026-12-15">15 December 2026</time>
                    </p>
                </article>
            {% endfor %}
        </section>
    </main>
</body>
</html>
