
<!DOCTYPE html>
<html lang="en-GB">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Makers BnB - Requests</title>
        <link rel="stylesheet" href="/static/css/styles.css">
    </head>
    <body>
        <header>
            <img id="logo" src="/static/images/makers-bnb-light-mode-logo.png" alt="Makers BnB logo">
            <nav>
                <a class="navigation" href="/spaces">Spaces</a>
                <a class="navigation current-page" href="/requests">Requests</a>
                <form action="/logout" method="POST" style="display: inline-block; margin:0; padding: 0; border: none;">
                    <button type="submit" class="navigation" style="background: none; border: none; padding: 0; color: inherit; cursor: pointer; font: inherit;">Log Out</button>
                </form>"
            </nav>
        </header>
        <main>
            <h1 class="intro">Booking requests</h1>
            <section>
                <h2 class="requests">Requests I've received</h2>
                {% for request in requests %}
                <article class="card">
                    <h3>Cosy Cottage in the Cotswolds</h3>
                    <p>
                        Requested dates:
                        <time datetime="{{ request.requested_date }}">
                            {{ request.requested_date }}
                        </time>
                    </p>
                </article>
                {% endfor %}
            </section>
        </main>
    </body>
</html>
