<!DOCTYPE html>
<html lang="en-GB">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Makers BnB - Log In</title>
        <link rel="stylesheet" href="/static/css/styles.css">
    </head>
    <body>
        <header>
            <img id="logo" src="/static/images/makers-bnb-light-mode-logo.png">
            {% include '/partials/search_bar.html' %}
            <nav>
                <a class="navigation" href="/">Sign Up</a>
            </nav>
        </header>
        <main>
            <div class="card">
                <h2>Log in to MakersBnB</h2>
                {% for message in get_flashed_messages() %}
                <p style="color: red;"> {{message}} </p>
        {% endfor %}
        <form method="POST" action="/sessions">
                    <label for="email">Email Address</label>
                    <input type="text" id="email" name="email" placeholder="example@example.com" required><br>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="password123" required><br>

                    <input type="submit" value="Log In">
                </form>
            </div>
            <h3 class="intro"> Don't have an account? <a href="/" style="color: rgb(61, 61, 251); text-decoration: underline;">Sign up here</a>.</h3>
</main>
    </body>
</html>
