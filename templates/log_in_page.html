<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - MakersBnB</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <div>
        <svg version="1.1" id="_x32_" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="77px" height="77px" viewBox="0 0 512 512" xml:space="preserve" fill="#000000"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <style type="text/css">  .st0{fill:#000000;}  </style> <g> <polygon class="st0" points="442.531,218 344.828,120.297 256,31.469 167.172,120.297 69.438,218.047 0,287.469 39.984,327.453 109.406,258.031 207.156,160.281 256,111.438 304.844,160.281 402.531,257.984 472.016,327.453 512,287.469 "></polygon> <polygon class="st0" points="85.719,330.375 85.719,480.531 274.75,480.531 274.75,361.547 343.578,361.547 343.578,480.531 426.281,480.531 426.281,330.328 256.016,160.063 "></polygon> </g> </g></svg>
        <a href ="/about"> About </a> | <a href ="/login"> Login </a>
    </div>
</head>

<main>
    <div>
        <h2>Log in to MakersBnB</h2>
        {% for message in get_flashed_messages() %}
        <p style="color: red;"> {{message}} </p>
        {% endfor %}
        <form method="POST" action="/sessions">
            <label for="email">Email Address</label>
            <input type="text" id="email" name="email" placeholder="Email" required><br>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" required><br>

            <input type="submit" value="Log In">
        </form>
    </div>
    <h3> Don't have an account? <a href="/" style="color: rgb(61, 61, 251); text-decoration: underline;">Sign up here</a>.</h3>
</main>
</html>
