<!DOCTYPE html>
<html lang="en-GB">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Makers BnB - Log In</title>
        <link rel="stylesheet" href="/static/css/styles.css">
    </head>
    <body>
        <header>
            <img id="logo" src="/static/images/makers-bnb-light-mode-logo.png" alt="MakersBnB Logo">
            {% include '/partials/search_bar.html' %}
            <nav aria-label="Main Navigation">
                <a class="navigation" href="/">Sign Up</a>
            </nav>
        </header>
        <main>
            <div class="card">
                <h1>Log in to MakersBnB</h1>
                {% for message in get_flashed_messages() %}
                <p role="alert" style="color: rgb(136, 9, 9);"> {{message}} </p>
        {% endfor %}
        <br>
        <br>
        <br>

        <form method="POST" action="/sessions">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="example@example.com" required><br>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="password123" required><br>

                    <input type="submit" value="Log In">
                </form>
            </div>
            <p class="intro"> Don't have an account? <a href="/" style="color: rgb(14, 14, 170); text-decoration: underline;">Sign up here</a>.</p>
</main>
    </body>
</html>
