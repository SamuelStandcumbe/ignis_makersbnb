<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking request - MakersBnB</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
</head>
<body>
        <header>
            <img id="logo" src="/static/images/makers-bnb-light-mode-logo.png" alt="Makers BnB logo">
            <nav>
                <form action="/logout" method="POST" style="display: inline-block; margin:0; padding: 0; border: none;">
                    <button type="submit" class="navigation" style="background: none; border: none; padding: 0; color: inherit; cursor: pointer; font: inherit;">Log Out</button>
                </form>"
            </nav>
        </header>
    <main>
        <h1>Booking request</h1>
        <article class="request">
            <h2>Cosy Cottage in the Cotswolds</h2>
            <dl>
                <dt>Requested by</dt>
                <dd>Jane Smith</dd>

                <dt>Requested dates</dt>
                <dd>
                    <time datetime="2026-12-12">12 December 2026</time>
                    to
                    <time datetime="2026-12-15">15 December 2026</time>
                </dd>
            </dl>
        </article>
    </main>
</body>
</html>
