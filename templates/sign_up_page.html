<main>
    <h1>Feel at home, anywhere</h1>
    <p>Introductory blurb text</p>
    <div>
        <h2>Sign up to MakersBnB</h2>
        <form method="POST" action="/users">
            <label for="email">Email Address</label>
            <input type="text" id="email" name="email" placeholder="Email" required><br>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" required><br>

            <label for="password">Password confirmation</label>
            <input type="password" id="password_confirmation" name="password_confirmation" placeholder="Password" required><br>
            
            <label for="is_host">Check this box if you are signing up as a host</label>
            <input type="checkbox" id="is_host" name="is_host"><br><br>

            <input type="submit" value="Sign Up">
        </form>
    </div>
</main>
